<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuyList</title>
  <link rel="stylesheet" href="main.css">
</head>

<body>
  <main class="page">
    <section class="panel">
      <form class="add-form">
        <label class="visually-hidden" for="product-input">Назва товару</label>
        <input id="product-input" type="text" placeholder="Назва товару">
        <button class="add-button" type="button" data-tooltip="Додати товар">Додати</button>
      </form>

      <ul class="shopping-list">
        <li class="shopping-row">
          <span class="product-name crossed">Помідори</span>

          <div class="counter">
            <button class="circle-button minus disabled" type="button" data-tooltip="Зменшення недоступне" disabled>−</button>
            <span class="amount">2</span>
            <button class="circle-button plus" type="button" data-tooltip="Збільшити кількість">+</button>
          </div>

          <div class="actions">
            <button class="status-button" type="button" data-tooltip="Повернути до списку">Не куплено</button>
          </div>
        </li>

        <li class="shopping-row">
          <span class="product-name">Печиво</span>

          <div class="counter">
            <button class="circle-button minus" type="button" data-tooltip="Зменшити кількість">−</button>
            <span class="amount">2</span>
            <button class="circle-button plus" type="button" data-tooltip="Збільшити кількість">+</button>
          </div>

          <div class="actions">
            <button class="status-button" type="button" data-tooltip="Позначити як куплене">Куплено</button>
            <button class="delete-button" type="button" data-tooltip="Видалити товар">×</button>
          </div>
        </li>

        <li class="shopping-row">
          <input class="edit-input" type="text" value="Сир" aria-label="Редагувати назву товару">

          <div class="counter">
            <button class="circle-button minus disabled" type="button" data-tooltip="Зменшення недоступне" disabled>−</button>
            <span class="amount">1</span>
            <button class="circle-button plus" type="button" data-tooltip="Збільшити кількість">+</button>
          </div>

          <div class="actions">
            <button class="status-button" type="button" data-tooltip="Позначити як куплене">Куплено</button>
            <button class="delete-button" type="button" data-tooltip="Видалити товар">×</button>
          </div>
        </li>
      </ul>
    </section>

    <aside class="panel summary">
      <section class="summary-section">
        <h2>Залишилося</h2>

        <div class="tags">
          <span class="tag">Печиво <span class="tag-count">2</span></span>
          <span class="tag">Сир <span class="tag-count">1</span></span>
        </div>
      </section>

      <section class="summary-section">
        <h2>Куплено</h2>

        <div class="tags">
          <span class="tag crossed">Помідори <span class="tag-count">2</span></span>
        </div>
      </section>
    </aside>
  </main>

  <div class="badge" aria-label="Інформація про автора">
    <span class="badge-title">BuyList</span>

    <span class="badge-author">
      Created by:<br>
      Пруцька Софія
    </span>

    <span class="badge-print">
      Created by:<br>
      Пруцька Софія
    </span>
  </div>
</body>
</html>
